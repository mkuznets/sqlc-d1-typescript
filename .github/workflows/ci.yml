name: compatibility

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Run the uncredentialed verification suite or upstream drift discovery
        required: true
        default: verification
        type: choice
        options: [verification, drift]

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.config.outputs.node }}
      npm: ${{ steps.config.outputs.npm }}
      bun: ${{ steps.config.outputs.bun }}
      sqlc-matrix: ${{ steps.config.outputs.sqlc-matrix }}
      sqlc-ceiling-install: ${{ steps.config.outputs.sqlc-ceiling-install }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: config
        name: Read authoritative compatibility inputs
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('verification/compatibility.json', 'utf8'));
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `node=${config.tools.node}\n`);
          fs.appendFileSync(output, `npm=${config.tools.npm}\n`);
          fs.appendFileSync(output, `bun=${config.tools.bun}\n`);
          fs.appendFileSync(output, `sqlc-matrix=${JSON.stringify(config.sqlc.samples.map(({ version }) => ({ version, install: version.replace(/^v/, '') })))}\n`);
          fs.appendFileSync(output, `sqlc-ceiling-install=${config.sqlc.testedCeiling.replace(/^v/, '')}\n`);
          NODE

  baseline-and-build:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'verification')
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ needs.config.outputs.node }}", cache: npm }
      - run: npm install --global npm@${{ needs.config.outputs.npm }}
      - run: node --version && npm --version && npm ci
      - run: make test-generator
      - run: node scripts/check-compatibility.mjs
      - run: make build
      - name: Record candidate identity
        run: |
          sha256sum build/plugin.wasm | awk '{print $1}' > candidate.sha256
          cat candidate.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: publication-candidate, path: "build/plugin.wasm\ncandidate.sha256", if-no-files-found: error }

  exact-candidate:
    needs: [config, baseline-and-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ needs.config.outputs.node }}", cache: npm }
      - run: npm install --global npm@${{ needs.config.outputs.npm }} && node --version && npm --version && npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: publication-candidate, path: candidate }
      - run: test "$(sha256sum candidate/build/plugin.wasm | awk '{print $1}')" = "$(cat candidate/candidate.sha256)"
      - run: make test-candidate CANDIDATE_WASM="$PWD/candidate/build/plugin.wasm" CANDIDATE_SHA256="$(cat candidate/candidate.sha256)"

  public-types:
    needs: [config, baseline-and-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ needs.config.outputs.node }}", cache: npm }
      - run: npm install --global npm@${{ needs.config.outputs.npm }} && node --version && npm --version && npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: publication-candidate, path: candidate }
      - run: test "$(sha256sum candidate/build/plugin.wasm | awk '{print $1}')" = "$(cat candidate/candidate.sha256)"
      - run: make test-types CANDIDATE_WASM="$PWD/candidate/build/plugin.wasm" CANDIDATE_SHA256="$(cat candidate/candidate.sha256)"

  miniflare:
    needs: [config, baseline-and-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ needs.config.outputs.node }}" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "${{ needs.config.outputs.bun }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: publication-candidate, path: candidate }
      - run: node --version && npm --version && bun --version
      - run: test "$(sha256sum candidate/build/plugin.wasm | awk '{print $1}')" = "$(cat candidate/candidate.sha256)"
      - run: make test-miniflare CANDIDATE_WASM="$PWD/candidate/build/plugin.wasm" CANDIDATE_SHA256="$(cat candidate/candidate.sha256)"

  canonical-example:
    needs: [config, baseline-and-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ needs.config.outputs.node }}" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "${{ needs.config.outputs.bun }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: publication-candidate, path: candidate }
      - run: node --version && npm --version && bun --version
      - run: test "$(sha256sum candidate/build/plugin.wasm | awk '{print $1}')" = "$(cat candidate/candidate.sha256)"
      - run: make test-example CANDIDATE_WASM="$PWD/candidate/build/plugin.wasm" CANDIDATE_SHA256="$(cat candidate/candidate.sha256)"

  generated-drift:
    needs: [config, baseline-and-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ needs.config.outputs.node }}" }
      - uses: sqlc-dev/setup-sqlc@6bd2de0e87f5adfd968b55f140ce55461f71db69 # v4
        with: { sqlc-version: "${{ needs.config.outputs.sqlc-ceiling-install }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: publication-candidate, path: candidate }
      - run: node --version && npm --version && sqlc version
      - run: test "$(sha256sum candidate/build/plugin.wasm | awk '{print $1}')" = "$(cat candidate/candidate.sha256)"
      - run: make test-generated-drift-worktree CANDIDATE_WASM="$PWD/candidate/build/plugin.wasm" CANDIDATE_SHA256="$(cat candidate/candidate.sha256)"

  sqlc-compatibility:
    needs: [config, baseline-and-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlc: ${{ fromJSON(needs.config.outputs.sqlc-matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ needs.config.outputs.node }}", cache: npm }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "${{ needs.config.outputs.bun }}" }
      - run: npm install --global npm@${{ needs.config.outputs.npm }} && npm ci
      - uses: sqlc-dev/setup-sqlc@6bd2de0e87f5adfd968b55f140ce55461f71db69 # v4
        with: { sqlc-version: "${{ matrix.sqlc.install }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: publication-candidate, path: candidate }
      - run: node --version && npm --version && bun --version && sqlc version
      - run: test "$(sha256sum candidate/build/plugin.wasm | awk '{print $1}')" = "$(cat candidate/candidate.sha256)"
      - name: Verify cell and write actual evidence
        run: |
          node scripts/verify-sqlc-compatibility.mjs --candidate "$PWD/candidate/build/plugin.wasm" --sha256 "$(cat candidate/candidate.sha256)" --sqlc-version "${{ matrix.sqlc.version }}" --sqlc "$(command -v sqlc)" --output matrix-result.json
          node scripts/write-compatibility-evidence.mjs result=matrix-result.json output=compatibility-evidence.json node="$(node --version | sed 's/^v//')" npm="$(npm --version)" bun="$(bun --version)"
          cat matrix-result.json
          cat compatibility-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "compatibility-evidence-${{ matrix.sqlc.version }}", path: compatibility-evidence.json, if-no-files-found: error }

  upstream-drift:
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'drift')) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ needs.config.outputs.node }}", cache: npm }
      - run: npm install --global npm@${{ needs.config.outputs.npm }} && node --version && npm --version && npm ci
      - name: Check public upstream releases
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-upstream-compatibility.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
