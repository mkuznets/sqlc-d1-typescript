name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      sqlc-matrix: ${{ steps.setup.outputs.sqlc-matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: setup
        uses: ./.github/actions/setup
        with:
          bun: "true"
          sqlc: ceiling

      - name: Check formatting (run make fmt to fix)
        run: make fmt-check
      - name: Build the plugin and run every uncredentialed check against it
        run: make verify-local

      - name: Retain the built plugin for the compatibility matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-wasm
          path: build/plugin.wasm
          if-no-files-found: error

  sqlc-compatibility:
    name: sqlc ${{ matrix.sqlc.version }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlc: ${{ fromJSON(needs.verify.outputs.sqlc-matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          sqlc: ${{ matrix.sqlc.install }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-wasm
          path: build

      - name: Generate and type-check the fixtures with sqlc ${{ matrix.sqlc.version }}
        run: |
          node scripts/verify-sqlc-compatibility.ts \
            --candidate "$PWD/build/plugin.wasm" \
            --sqlc-version "${{ matrix.sqlc.version }}" \
            --sqlc "$(command -v sqlc)"
