name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          bun: "true"
          sqlc: 1.31.1

      - name: Check formatting (run make fmt to fix)
        run: make fmt-check
      - name: Build the plugin and run every uncredentialed check against it
        run: make verify-local

      - name: Retain the built plugin for the compatibility matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-wasm
          path: build/plugin.wasm
          if-no-files-found: error

  sqlc-compatibility:
    name: sqlc ${{ matrix.sqlc }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlc: ["1.25.0", "1.31.1"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup
        with:
          sqlc: ${{ matrix.sqlc }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-wasm
          path: build

      - name: Generate and type-check the fixtures with sqlc ${{ matrix.sqlc }}
        run: |
          node scripts/verify-sqlc-compatibility.ts \
            --candidate "$PWD/build/plugin.wasm" \
            --sqlc-version "${{ matrix.sqlc }}" \
            --sqlc "$(command -v sqlc)"
