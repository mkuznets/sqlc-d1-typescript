name: reusable-managed-d1
on:
  workflow_call:
    inputs:
      candidate-artifact-id:
        required: true
        type: string
      candidate-filename:
        required: true
        type: string
      candidate-sha256:
        required: true
        type: string
      source-commit:
        required: true
        type: string
      trigger:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: normal
    outputs:
      evidence-artifact-id:
        value: ${{ jobs.verify.outputs.evidence-artifact-id }}
      remote-date:
        value: ${{ jobs.verify.outputs.remote-date }}
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "${{ inputs.candidate-artifact-id }}"
          path: retained
          merge-multiple: true
      - run: node -e 'import("./scripts/candidate-utils.mjs").then(m=>m.readCandidate(`retained/${{ inputs.candidate-filename }}`,`${{ inputs.candidate-sha256 }}`))'
  verify:
    needs: preflight
    runs-on: ubuntu-latest
    environment: managed-d1
    outputs:
      evidence-artifact-id: ${{ steps.result.outputs.evidence-artifact-id }}
      remote-date: ${{ steps.result.outputs.remote-date }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.10"
      - uses: sqlc-dev/setup-sqlc@6bd2de0e87f5adfd968b55f140ce55461f71db69
        with:
          sqlc-version: "1.31.1"
      - run: npm install --global npm@11.6.2 && npm ci && cd test/miniflare && bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "${{ inputs.candidate-artifact-id }}"
          path: retained
          merge-multiple: true
      - id: lookup
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          node scripts/github-run-artifacts.mjs --repository "${{ github.repository }}" --run-id "${{ github.run_id }}" --prefix "managed-d1-evidence-${{ github.run_id }}-" --output managed-artifacts.json
          node scripts/select-managed-d1-evidence.mjs --artifacts managed-artifacts.json --repository "${{ github.repository }}" --run-id "${{ github.run_id }}" --sha256 "${{ inputs.candidate-sha256 }}" --source-commit "${{ inputs.source-commit }}" --trigger "${{ inputs.trigger }}" --output selection.json --github-output "$GITHUB_OUTPUT"

      - if: steps.lookup.outputs.mode == 'reuse'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "${{ steps.lookup.outputs.artifact-id }}"
          path: reused
      - if: steps.lookup.outputs.mode == 'reuse'
        run: cp reused/managed-d1-evidence.json managed-d1-evidence.json

      - id: execute
        if: steps.lookup.outputs.mode == 'create'
        name: Verify once and finalize evidence after primary cleanup
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/managed-d1.mjs verify --candidate "$PWD/retained/${{ inputs.candidate-filename }}" --sha256 "${{ inputs.candidate-sha256 }}" --source-commit "${{ inputs.source-commit }}" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --trigger "${{ inputs.trigger }}" --mode "${{ inputs.mode }}" --evidence-path managed-d1-evidence.json --state-path managed-d1-state.json --sqlc "$(command -v sqlc)"
      - name: Last-resort cleanup from persisted exact state
        if: ${{ always() && steps.lookup.outputs.mode == 'create' && !hashFiles('managed-d1-evidence.json') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/managed-d1.mjs cleanup --state-path managed-d1-state.json --report cleanup-recovery.json

      - id: upload
        if: ${{ always() && steps.lookup.outputs.mode == 'create' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "managed-d1-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
          path: managed-d1-evidence.json
          retention-days: 30
          if-no-files-found: error
      - id: recovery-upload
        if: ${{ always() && hashFiles('cleanup-recovery.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "managed-d1-recovery-${{ github.run_id }}-${{ github.run_attempt }}"
          path: cleanup-recovery.json
          retention-days: 30
          if-no-files-found: error

      - id: result
        if: ${{ always() }}
        run: |
          node scripts/managed-d1-contract.mjs validate-evidence --path managed-d1-evidence.json --sha256 "${{ inputs.candidate-sha256 }}" --source-commit "${{ inputs.source-commit }}" --run-id "${{ github.run_id }}" --passing true
          echo "remote-date=$(node -p "require('./managed-d1-evidence.json').run.remoteDate")" >> "$GITHUB_OUTPUT"
          SELECTED_ID="${{ steps.lookup.outputs.artifact-id }}"
          selected_id="${SELECTED_ID:-${{ steps.upload.outputs.artifact-id }}}"
          [[ "$selected_id" =~ ^[0-9]+$ ]]
          echo "evidence-artifact-id=$selected_id" >> "$GITHUB_OUTPUT"
          test "${{ steps.lookup.outputs.mode }}" = reuse || test "${{ steps.execute.outcome }}" = success
