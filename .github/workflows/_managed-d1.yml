name: reusable-managed-d1
on:
  workflow_call:
    inputs:
      candidate-artifact-id:
        required: true
        type: string
      candidate-filename:
        required: true
        type: string
      candidate-sha256:
        required: true
        type: string
      source-commit:
        required: true
        type: string
      trigger:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: normal
    outputs:
      evidence-artifact-id:
        value: ${{ jobs.verify.outputs.evidence-artifact-id }}
      remote-date:
        value: ${{ jobs.verify.outputs.remote-date }}
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    name: Preflight candidate identity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source under verification
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Download the retained candidate by exact artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "${{ inputs.candidate-artifact-id }}"
          path: retained
          merge-multiple: true
      - name: Verify the retained candidate before spending Cloudflare resources
        run: node scripts/workflows/verify-candidate-artifact.ts --candidate "retained/${{ inputs.candidate-filename }}" --sha256 "${{ inputs.candidate-sha256 }}"
  verify:
    name: Verify against real D1
    needs: preflight
    runs-on: ubuntu-latest
    environment: managed-d1
    outputs:
      evidence-artifact-id: ${{ steps.result.outputs.evidence-artifact-id }}
      remote-date: ${{ steps.result.outputs.remote-date }}
    steps:
      - name: Check out the source under verification
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Install the pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.10"
      - name: Install sqlc at the tested ceiling
        uses: sqlc-dev/setup-sqlc@6bd2de0e87f5adfd968b55f140ce55461f71db69
        with:
          sqlc-version: "1.31.1"
      - name: Install dependencies for the generator and the Miniflare fixture
        run: |
          echo "==> Installing npm@11.6.2 and dependencies"
          npm install --global npm@11.6.2
          npm ci
          echo "==> Installing the Miniflare fixture dependencies with Bun"
          cd test/miniflare && bun install --frozen-lockfile
      - name: Report the toolchain
        run: bash scripts/workflows/report-toolchain.sh node npm bun sqlc

      - name: Download the retained candidate by exact artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "${{ inputs.candidate-artifact-id }}"
          path: retained
          merge-multiple: true
      - id: lookup
        name: Reuse evidence from an earlier attempt of this run, if any
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          echo "==> Listing managed evidence artifacts already uploaded by run ${{ github.run_id }}"
          node scripts/github-run-artifacts.ts --repository "${{ github.repository }}" --run-id "${{ github.run_id }}" --prefix "managed-d1-evidence-${{ github.run_id }}-" --output managed-artifacts.json
          echo "==> Selecting evidence that attests this exact candidate, if a previous attempt produced any"
          node scripts/select-managed-d1-evidence.ts --artifacts managed-artifacts.json --repository "${{ github.repository }}" --run-id "${{ github.run_id }}" --sha256 "${{ inputs.candidate-sha256 }}" --source-commit "${{ inputs.source-commit }}" --trigger "${{ inputs.trigger }}" --output selection.json --github-output "$GITHUB_OUTPUT"
          echo "==> Selection:"
          cat selection.json

      - name: Download the reusable evidence
        if: steps.lookup.outputs.mode == 'reuse'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "${{ steps.lookup.outputs.artifact-id }}"
          path: reused
          merge-multiple: true
      - name: Adopt the reused evidence instead of provisioning again
        if: steps.lookup.outputs.mode == 'reuse'
        run: |
          echo "==> Reusing evidence artifact ${{ steps.lookup.outputs.artifact-id }}; no Cloudflare resources will be provisioned"
          cp reused/managed-d1-evidence.json managed-d1-evidence.json

      - id: execute
        if: steps.lookup.outputs.mode == 'create'
        name: Verify once and finalize evidence after primary cleanup
        # Allowed to continue so the last-resort cleanup below always runs; the result
        # step turns a failed verification back into a failed job.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is empty; the managed-d1 environment secret is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is empty; the repository variable is missing"; exit 1; }
          echo "==> Provisioning disposable D1 resources and verifying candidate ${{ inputs.candidate-sha256 }} (mode: ${{ inputs.mode }})"
          echo "    exact state is persisted to managed-d1-state.json so cleanup can run even if this step dies"
          node scripts/managed-d1.ts verify --candidate "$PWD/retained/${{ inputs.candidate-filename }}" --sha256 "${{ inputs.candidate-sha256 }}" --source-commit "${{ inputs.source-commit }}" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --trigger "${{ inputs.trigger }}" --mode "${{ inputs.mode }}" --evidence-path managed-d1-evidence.json --state-path managed-d1-state.json --sqlc "$(command -v sqlc)"
      - name: Last-resort cleanup from persisted exact state
        if: ${{ always() && steps.lookup.outputs.mode == 'create' && !hashFiles('managed-d1-evidence.json') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::warning::verification produced no evidence file; deleting every resource recorded in managed-d1-state.json"
          node scripts/managed-d1.ts cleanup --state-path managed-d1-state.json --report cleanup-recovery.json

      - id: upload
        name: Upload the managed evidence
        if: ${{ always() && steps.lookup.outputs.mode == 'create' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "managed-d1-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
          path: managed-d1-evidence.json
          retention-days: 30
          if-no-files-found: error
      - id: recovery-upload
        name: Upload the last-resort cleanup report
        if: ${{ always() && hashFiles('cleanup-recovery.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "managed-d1-recovery-${{ github.run_id }}-${{ github.run_attempt }}"
          path: cleanup-recovery.json
          retention-days: 30
          if-no-files-found: error

      - id: result
        name: Validate the evidence and decide the job outcome
        if: ${{ always() }}
        env:
          EVIDENCE_PATH: managed-d1-evidence.json
          CANDIDATE_SHA256: "${{ inputs.candidate-sha256 }}"
          SOURCE_COMMIT: "${{ inputs.source-commit }}"
          RUN_ID: "${{ github.run_id }}"
          LOOKUP_MODE: "${{ steps.lookup.outputs.mode }}"
          REUSED_ARTIFACT_ID: "${{ steps.lookup.outputs.artifact-id }}"
          CREATED_ARTIFACT_ID: "${{ steps.upload.outputs.artifact-id }}"
          VERIFY_OUTCOME: "${{ steps.execute.outcome }}"
        run: bash scripts/workflows/finalize-managed-evidence.sh
