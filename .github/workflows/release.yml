name: release

# A release is a SemVer `v*` tag pushed on default-branch lineage, and that tag is the
# maintainer's approval. There is no rehearsal mode: to try a release, cut the next
# patch version. The plugin is built once, in `verify`, and every later job uses those
# exact bytes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.intent.outputs.version }}
      tag: ${{ steps.intent.outputs.tag }}
      source-commit: ${{ steps.intent.outputs.source-commit }}
      workflow-url: ${{ steps.intent.outputs.workflow-url }}
      wasm-filename: ${{ steps.intent.outputs.wasm-filename }}
      manifest-filename: ${{ steps.intent.outputs.manifest-filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          sqlc: 1.31.1

      - name: Validate the release identity before building anything
        id: intent
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          node scripts/release.ts intent \
            --event "${{ github.event_name }}" --ref-type "${{ github.ref_type }}" \
            --ref-name "${{ github.ref_name }}" --sha "${{ github.sha }}" \
            --default-branch "$DEFAULT_BRANCH" --run-id "${{ github.run_id }}" \
            --server-url "${{ github.server_url }}" --repository "${{ github.repository }}"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Check formatting (run make fmt to fix)
        run: make fmt-check
      - name: Build the plugin and run every uncredentialed check against it
        run: make verify-local

      - name: Retain the exact bytes this release will publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-wasm
          path: build/plugin.wasm
          if-no-files-found: error

  sqlc-compatibility:
    name: sqlc ${{ matrix.sqlc }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sqlc: ["1.25.0", "1.31.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          sqlc: ${{ matrix.sqlc }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-wasm
          path: build

      - name: Generate and type-check the fixtures with sqlc ${{ matrix.sqlc }}
        run: |
          node scripts/verify-sqlc-compatibility.ts \
            --candidate "$PWD/build/plugin.wasm" \
            --sqlc-version "${{ matrix.sqlc }}" \
            --sqlc "$(command -v sqlc)"

  # The only job that writes anything outside this run. R2 first, because the release
  # notes advertise a URL that must already serve the bytes; the object write is
  # create-only, so a published version key can never be replaced.
  publish:
    name: Publish
    needs: [verify, sqlc-compatibility]
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: write
    env:
      WASM: ${{ needs.verify.outputs.wasm-filename }}
      MANIFEST: ${{ needs.verify.outputs.manifest-filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-wasm
          path: build

      - name: Name the artifact and write its manifest
        run: |
          cp build/plugin.wasm "$WASM"
          node scripts/release.ts manifest \
            --wasm "$WASM" --version "${{ needs.verify.outputs.version }}" \
            --tag "${{ needs.verify.outputs.tag }}" \
            --source-commit "${{ needs.verify.outputs.source-commit }}" \
            --workflow-url "${{ needs.verify.outputs.workflow-url }}" \
            --output "$MANIFEST"

      - name: Publish the artifact to R2 under its permanent version key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_PAGER: ""
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::R2_ACCESS_KEY_ID is empty"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::R2_SECRET_ACCESS_KEY is empty"; exit 1; }
          echo "==> Writing plugins/$WASM to R2, create-only"
          aws s3api put-object \
            --bucket sqlc --key "plugins/$WASM" --body "$WASM" \
            --if-none-match '*' --content-type application/wasm \
            --content-md5 "$(openssl dgst -md5 -binary "$WASM" | base64)"

      - name: Confirm the published bytes are served before advertising them
        run: |
          url="https://sqlc.mkuznets.com/plugins/$WASM"
          echo "==> Downloading $url and comparing it to what we published"
          curl -fsSL "$url" -o published.wasm
          expected="$(shasum -a 256 "$WASM" | awk '{print $1}')"
          actual="$(shasum -a 256 published.wasm | awk '{print $1}')"
          echo "    expected $expected"
          echo "    actual   $actual"
          test "$expected" = "$actual" || { echo "::error::the public origin served different bytes than the release artifact"; exit 1; }

      - name: Cut the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          git tag -l --format='%(contents:body)' "$TAG" >release-notes.md
          gh release create "$TAG" "$WASM" "$MANIFEST" --title "$TAG" --notes-file release-notes.md
