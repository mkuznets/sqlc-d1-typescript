name: managed-d1
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Maintainer-only disposable fault mode
        required: true
        default: normal
        type: choice
        options: [normal, simulate-test-failure, simulate-cleanup-failure]
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.repository }}-managed-d1
  cancel-in-progress: false
jobs:
  default-branch:
    name: Guard branch and resolve pinned toolchain
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.config.outputs.node }}
      npm: ${{ steps.config.outputs.npm }}
      sqlc: ${{ steps.config.outputs.sqlc-ceiling-install }}
    steps:
      - name: Refuse to spend Cloudflare resources from a non-default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::managed verification must run from ${{ github.event.repository.default_branch }}, but this run is on ${{ github.ref }}; it provisions real Cloudflare resources and is only trusted from the default branch"
          exit 1

      - name: Check out the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: config
        name: Read authoritative compatibility inputs
        run: node scripts/workflows/emit-compatibility-outputs.ts
  build-candidate:
    name: Build the candidate under managed verification
    needs: default-branch
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      filename: plugin.wasm
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "${{ needs.default-branch.outputs.node }}"
          cache: npm
      - name: Install dependencies and build from a clean tree
        run: |
          echo "==> Installing npm@${{ needs.default-branch.outputs.npm }} and dependencies"
          npm install --global npm@${{ needs.default-branch.outputs.npm }}
          bash scripts/workflows/report-toolchain.sh node npm
          npm ci
          echo "==> Removing any stale build output so the candidate is built from source"
          rm -f build/out.js build/plugin.wasm
          make build

      - id: digest
        name: Record candidate identity
        run: |
          sha256="$(shasum -a 256 build/plugin.wasm | awk '{print $1}')"
          echo "==> Built candidate build/plugin.wasm"
          echo "    size   $(wc -c <build/plugin.wasm | tr -d ' ') bytes"
          echo "    sha256 $sha256"
          echo "sha256=$sha256" >>"$GITHUB_OUTPUT"

      - id: upload
        name: Retain the candidate for the credentialed job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "managed-d1-candidate-${{ github.run_id }}"
          path: build/plugin.wasm
          retention-days: 30
          if-no-files-found: error
  managed-d1:
    name: Managed D1 verification
    needs: build-candidate
    uses: ./.github/workflows/_managed-d1.yml
    with:
      candidate-artifact-id: ${{ needs.build-candidate.outputs.artifact-id }}
      candidate-filename: ${{ needs.build-candidate.outputs.filename }}
      candidate-sha256: ${{ needs.build-candidate.outputs.sha256 }}
      source-commit: ${{ github.sha }}
      trigger: ${{ github.event_name }}
      mode: ${{ inputs.mode || 'normal' }}
    secrets: inherit
  reap-stale-managed-d1:
    name: Reap stale managed resources
    needs: default-branch
    if: ${{ always() && needs.default-branch.result == 'success' }}
    runs-on: ubuntu-latest
    environment: managed-d1
    steps:
      - name: Check out the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install the pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "${{ needs.default-branch.outputs.node }}"
          cache: npm
      - name: Install dependencies
        run: |
          echo "==> Installing dependencies for the reaper"
          npm ci

      - name: Delete managed resources left behind by earlier runs
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is empty; the managed-d1 environment secret is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is empty; the repository variable is missing"; exit 1; }
          echo "==> Reaping managed D1 resources left behind by earlier runs; the report lists everything deleted"
          node scripts/reap-managed-d1.ts reap --output managed-d1-reaper-report.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload the reaper report (also when reaping failed)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "managed-d1-reaper-${{ github.run_id }}-${{ github.run_attempt }}"
          path: managed-d1-reaper-report.json
          retention-days: 30
          if-no-files-found: error
