name: managed-d1
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Maintainer-only disposable fault mode
        required: true
        default: normal
        type: choice
        options: [normal, simulate-test-failure, simulate-cleanup-failure]
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.repository }}-managed-d1
  cancel-in-progress: false
jobs:
  default-branch:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.config.outputs.node }}
      npm: ${{ steps.config.outputs.npm }}
      sqlc: ${{ steps.config.outputs.sqlc }}
    steps:
      - if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "managed verification must run from the default branch" >&2; exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: config
        run: |
          echo "node=$(node -p "require('./verification/compatibility.json').tools.node")" >> "$GITHUB_OUTPUT"
          echo "npm=$(node -p "require('./verification/compatibility.json').tools.npm")" >> "$GITHUB_OUTPUT"
          echo "sqlc=$(node -p "require('./verification/compatibility.json').sqlc.testedCeiling.slice(1)")" >> "$GITHUB_OUTPUT"
  build-candidate:
    needs: default-branch
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      filename: plugin.wasm
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "${{ needs.default-branch.outputs.node }}"
          cache: npm
      - run: npm install --global npm@${{ needs.default-branch.outputs.npm }} && npm ci && rm -f build/out.js build/plugin.wasm && make build

      - id: digest
        run: echo "sha256=$(shasum -a 256 build/plugin.wasm | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "managed-d1-candidate-${{ github.run_id }}"
          path: build/plugin.wasm
          retention-days: 30
          if-no-files-found: error
  managed-d1:
    needs: build-candidate
    uses: ./.github/workflows/_managed-d1.yml
    with:
      candidate-artifact-id: ${{ needs.build-candidate.outputs.artifact-id }}
      candidate-filename: ${{ needs.build-candidate.outputs.filename }}
      candidate-sha256: ${{ needs.build-candidate.outputs.sha256 }}
      source-commit: ${{ github.sha }}
      trigger: ${{ github.event_name }}
      mode: ${{ inputs.mode || 'normal' }}
    secrets: inherit
  reap-stale-managed-d1:
    needs: default-branch
    if: ${{ always() && needs.default-branch.result == 'success' }}
    runs-on: ubuntu-latest
    environment: managed-d1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "${{ needs.default-branch.outputs.node }}"
          cache: npm
      - run: npm ci

      - run: node scripts/reap-managed-d1.mjs reap --output managed-d1-reaper-report.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "managed-d1-reaper-${{ github.run_id }}-${{ github.run_attempt }}"
          path: managed-d1-reaper-report.json
          retention-days: 30
          if-no-files-found: error
